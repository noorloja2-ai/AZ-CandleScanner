plugins { id 'com.android.application' }
android {
 namespace 'com.example.floatingcandlescanner'; compileSdk 35
 defaultConfig { applicationId 'com.example.floatingcandlescanner.az'; minSdk 26; targetSdk 35; versionCode 84; versionName '16.16' }
 buildFeatures { buildConfig true }
 signingConfigs {
  permanent {
   storeFile file(System.getenv('AZ_KEYSTORE_PATH') ?: '../candlescanner-permanent.jks')
   storePassword System.getenv('AZ_KEYSTORE_PASSWORD')
   keyAlias System.getenv('AZ_KEY_ALIAS') ?: 'candlescanner'
   keyPassword System.getenv('AZ_KEY_PASSWORD')
  }
 }
 buildTypes { release { signingConfig signingConfigs.permanent; minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
