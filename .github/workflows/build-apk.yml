name: Build signed Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        env:
          AZ_KEYSTORE_BASE64: ${{ secrets.AZ_KEYSTORE_BASE64 }}
        run: echo "$AZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/candlescanner-permanent.jks"
      - name: Build signed release APK
        env:
          AZ_KEYSTORE_PATH: ${{ runner.temp }}/candlescanner-permanent.jks
          AZ_KEYSTORE_PASSWORD: ${{ secrets.AZ_KEYSTORE_PASSWORD }}
          AZ_KEY_ALIAS: candlescanner
          AZ_KEY_PASSWORD: ${{ secrets.AZ_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk CandleScanner_v15.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CandleScanner-v15.0-signed
          path: CandleScanner_v15.0.apk
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v15.0 CandleScanner_v15.0.apk --title "CandleScanner v15.0" --notes "Permanent GitHub in-app update channel. Keeps all v14.9 learning features." --latest || gh release upload v15.0 CandleScanner_v15.0.apk --clobber
