name: Build signed Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        env:
          AZ_KEYSTORE_BASE64: ${{ secrets.AZ_KEYSTORE_BASE64 }}
        run: echo "$AZ_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/candlescanner-permanent.jks"
      - name: Build signed release APK
        env:
          AZ_KEYSTORE_PATH: ${{ runner.temp }}/candlescanner-permanent.jks
          AZ_KEYSTORE_PASSWORD: ${{ secrets.AZ_KEYSTORE_PASSWORD }}
          AZ_KEY_ALIAS: candlescanner
          AZ_KEY_PASSWORD: ${{ secrets.AZ_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :license-generator:assembleRelease --stacktrace
      - run: |
          cp app/build/outputs/apk/release/app-release.apk CandleScanner_v16.10.apk
          cp license-generator/build/outputs/apk/release/license-generator-release.apk AZ_Licence_Generator_v1.1.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CandleScanner-v16.10-signed
          path: |
            CandleScanner_v16.10.apk
            AZ_Licence_Generator_v1.1.apk
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v16.10 CandleScanner_v16.10.apk AZ_Licence_Generator_v1.1.apk --title "CandleScanner v16.10" --notes-file CHANGELOG_v16.10.txt --latest || gh release upload v16.10 CandleScanner_v16.10.apk AZ_Licence_Generator_v1.1.apk --clobber
